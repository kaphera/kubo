[package]
name = "kubo-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
# Enable this feature when running against a real k3d cluster.
# Gated behind a feature flag because it requires a live cluster.
k3d = ["dep:kube", "dep:k8s-openapi"]

[dependencies]
kubo-test-fakeapi = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tower = { workspace = true }
kube = { workspace = true, features = ["client"], optional = true }
k8s-openapi = { workspace = true, features = ["latest"], optional = true }
