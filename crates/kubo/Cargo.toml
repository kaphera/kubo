[package]
name = "kubo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
test-support = [
    "dep:kubo-test-fakeapi",
    "dep:kubo-test-macros",
    "dep:proptest",
    "kube/client",
    "kube/derive",
    "tokio/test-util",
    "tokio/time",
]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures = { workspace = true }
gethostname.workspace = true
k8s-openapi = { workspace = true, features = ["latest", "schemars"] }
kube = { workspace = true, features = ["runtime"] }
kubo-test-fakeapi = { workspace = true, optional = true }
kubo-test-macros = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
kubo = { workspace = true, features = ["test-support"] }
kube = { workspace = true, features = ["runtime", "derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "test-util"] }
