[workspace]
resolver = "3"
members = [
    "crates/kubo",
    "crates/kubo-conformance",
    "crates/kubo-test",
    "crates/kubo-test-fakeapi",
    "crates/kubo-test-macros",
]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1.89"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower = "0.5"
futures = "0.3"
gethostname = "1"
k8s-openapi = { version = "0.27", default-features = false }
kube = { version = "3.1.0" }
proptest = "1.11.0"
rand = "0.9"
schemars = "1"
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1" }
tokio-util = "0.7"
tracing = "0.1"
