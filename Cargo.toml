[package]
name = "k8s-operator-reconciler"
version = "0.1.0"
edition = "2024"

[features]
default = ["test-support"]
test-support = []

[dependencies]
async-trait = "0.1.89"
k8s-openapi = { version = "0.27", default-features = false, features = ["latest", "schemars"] }
kube = { version = "3.1.0", features = ["runtime"] }
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
kube = { version = "3.1.0", features = ["runtime", "derive"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
