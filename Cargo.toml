[package]
name = "k8s-operator-reconciler"
version = "0.1.0"
edition = "2024"

[features]
default = ["test-support"]
test-support = []

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
futures = "0.3"
gethostname = "1"
k8s-openapi = { version = "0.27", default-features = false, features = ["latest", "schemars"] }
kube = { version = "3.1.0", features = ["runtime"] }
proptest = "1.11.0"
schemars = "1"
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt", "macros", "signal"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
kube = { version = "3.1.0", features = ["runtime", "derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "test-util"] }
