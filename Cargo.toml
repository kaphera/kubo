[workspace]
resolver = "3"
members = [
    "crates/kubo",
    "crates/kubo-conformance",
    "crates/kubo-test-fakeapi",
    "crates/kubo-test-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/kaphera/kubo"
homepage = "https://github.com/kaphera/kubo"

[workspace.dependencies]
kubo = { version = "0.1.0", path = "crates/kubo" }
kubo-test-fakeapi = { version = "0.1.0", path = "crates/kubo-test-fakeapi" }
kubo-test-macros = { version = "0.1.0", path = "crates/kubo-test-macros" }
anyhow = "1"
async-trait = "0.1.89"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower = "0.5"
futures = "0.3"
gethostname = "1"
k8s-openapi = { version = "0.27", default-features = false }
kube = { version = "3.1.0" }
proptest = "1.11.0"
rand = "0.9"
schemars = "1"
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1" }
tokio-util = "0.7"
tracing = "0.1"
